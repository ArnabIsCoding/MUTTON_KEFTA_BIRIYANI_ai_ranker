Methodology_Summary: |
  Built a hybrid scoring system combining deterministic keyword-based career analysis with TF-IDF semantic similarity. Uses 9 scoring groups: career description keyword matching (primary signal), TF-IDF cosine similarity to JD (secondary semantic signal), skills corroboration, anti-negative gates, experience band, location fit, behavioral availability signals, honeypot detection, and education tier. Hard gates eliminate non-technical titles, consulting-only careers, and honeypot profiles. No neural models at rank time — pure Python + pandas + numpy + pre-computed TF-IDF scores. Outputs fact-based, per-candidate reasoning with structural variety.

